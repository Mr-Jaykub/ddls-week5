<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PBMC cluster explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-7xl p-4 sm:p-6">
    <header class="mb-5"><h1 class="text-2xl font-bold">PBMC cluster explorer</h1><p class="text-sm text-slate-600">Explore the existing UMAP and individual cells.</p></header>
    <section class="flex flex-col gap-4 lg:grid lg:grid-cols-[20rem_1fr]">
      <section class="order-1 min-w-0 rounded-xl bg-white p-2 shadow-sm sm:p-4 lg:order-2 lg:min-h-[48rem]">
        <div id="legend" class="mb-2 text-sm text-slate-600"></div>
        <div id="clusterKey" class="mb-2 flex flex-wrap gap-2 text-xs"></div>
        <div id="plot" class="h-[55vh] min-h-[20rem] w-full"></div>
        <div id="cellPlot" class="mt-4 h-[42rem] w-full"></div>
      </section>
      <aside class="order-2 rounded-xl bg-white p-4 shadow-sm lg:order-1 lg:w-[28rem]">
        <div class="grid gap-3">
          <label class="text-sm font-medium">Cluster
            <select id="cluster" class="mt-1 w-full rounded border p-2"></select>
          </label>
          <label class="text-sm font-medium">Colour map
            <select id="colourMode" class="mt-1 w-full rounded border p-2">
              <option value="cluster">Cluster</option>
              <option value="n_genes">Genes detected</option>
              <option value="total_counts">Total counts</option>
              <option value="pct_mito">Mitochondrial %</option>
              <option value="gene">Gene expression</option>
            </select>
          </label>
          <label id="geneControl" class="hidden text-sm font-medium">Gene
            <input id="gene" list="genes" value="CD3D" placeholder="e.g. CD3D" class="mt-1 w-full rounded border p-2">
            <datalist id="genes"></datalist>
          </label>
          <button id="refresh" class="rounded bg-blue-600 px-3 py-2 font-medium text-white">Show cluster cells</button>
        </div>
        <div id="summary" class="mt-4 text-sm"></div>
        <div id="cells" class="mt-3 max-h-72 overflow-auto text-xs"></div>
      </aside>
    </section>
  </main>
<script>
const clusterEl = document.querySelector('#cluster'), geneEl = document.querySelector('#gene'), colourMode = document.querySelector('#colourMode');
let selected = null;
async function get(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function loadMeta() {
  const m = await get('/api/meta');
  m.clusters.forEach(c => clusterEl.add(new Option(c, c)));
  clusterEl.value = '7';
  m.genes.forEach(g => document.querySelector('#genes').append(new Option(g)));
  await draw();
}
async function draw() {
  const cluster = clusterEl.value, gene = geneEl.value.trim();
  const colour = colourMode.value === 'gene' ? gene : colourMode.value;
  if (colourMode.value === 'gene' && !gene) throw new Error('Choose a gene to colour the map.');
  const [u, c] = await Promise.all([get(`/api/umap?color=${encodeURIComponent(colour)}`), get(`/api/cluster/${cluster}${gene ? `?gene=${encodeURIComponent(gene)}` : ''}`)]);
  const points = u.points;
  const numeric = u.numeric;
  const selectedPoints = points.map(p => p.cluster === cluster);
  document.querySelector('#legend').innerHTML = numeric ? `<span class="font-medium">Legend:</span> colour scale shows ${colour}; selected cluster ${cluster} is outlined` : `<span class="font-medium">Legend:</span> selected cluster ${cluster} is highlighted`;
  const palette = ['#2563eb','#dc2626','#16a34a','#9333ea','#ea580c','#0891b2','#db2777','#ca8a04'];
  const clusterColours = Object.fromEntries([...new Set(points.map(p => p.cluster))].map((cl, i) => [cl, palette[i % palette.length]]));
  document.querySelector('#clusterKey').innerHTML = Object.entries(clusterColours).map(([cl, colourValue]) => `<span class="inline-flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-full" style="background:${colourValue}"></span>Cluster ${cl}</span>`).join('');
  const markerColours = numeric ? points.map(p=>p.value) : points.map(p=>clusterColours[p.cluster]);
  Plotly.react('plot', [{x: points.map(p=>p.x), y: points.map(p=>p.y), text: points.map(p=>p.cell), customdata: points.map(p=>[p.cluster, p.value]), mode:'markers', type:'scattergl', marker:{size:points.map((p,i)=>selectedPoints[i] ? 10 : 6), color:markerColours, colorscale:numeric ? 'Viridis' : undefined, showscale:numeric, colorbar:numeric ? {title: colour} : undefined, opacity:points.map((p,i)=>selectedPoints[i] ? 1 : 0.65), line:{color:points.map((p,i)=>selectedPoints[i] && !numeric ? '#111827' : 'rgba(0,0,0,0)'), width:points.map((p,i)=>selectedPoints[i] && !numeric ? 2 : 0)}}, hovertemplate:'cell %{text}<br>cluster %{customdata[0]}<br>value %{customdata[1]}<extra></extra>'}], {title:`UMAP — ${colour}`, autosize:true, margin:{t:40,l:40,r:10,b:40}, xaxis:{title:'UMAP 1', zeroline:false}, yaxis:{title:'UMAP 2', zeroline:false}}, {responsive:true, displayModeBar:false});
  const q = c.quality;
  const fmt = (value) => value == null ? '—' : Number(value).toPrecision(3);
  const pct = (value) => `${Number(value).toFixed(0)}%`;
  document.querySelector('#summary').innerHTML = `<b>Cluster ${cluster}</b><br>${q.length} cells<br><span class="font-medium">Top markers</span><div class="mt-1 overflow-x-auto"><table class="w-full min-w-[34rem] text-left text-xs whitespace-nowrap"><thead><tr><th>Gene</th><th>Score</th><th>logFC</th><th>Adj. p</th><th>Detected<br>C / R</th><th>Median<br>C / R</th></tr></thead><tbody>${c.top_markers.map(m => `<tr><td class="pr-2 font-medium">${m.gene}</td><td>${fmt(m.score)}</td><td>${fmt(m.logfoldchange)}</td><td>${m.pvals_adj == null ? '—' : Number(m.pvals_adj).toExponential(1)}</td><td>${pct(m.cluster_detection_pct)} / ${pct(m.rest_detection_pct)}</td><td>${fmt(m.cluster_median)} / ${fmt(m.rest_median)}</td></tr>`).join('')}</tbody></table><p class="mt-1 text-slate-500">C = cluster; R = rest.</p></div>`;
  document.querySelector('#cells').innerHTML = `<details><summary class="cursor-pointer font-medium">Individual cells (${q.length})</summary><div class="mt-2 max-h-48 overflow-auto">${q.map((x,i)=>`${i+1}. ${x.cell}: genes ${x.n_genes}, counts ${x.total_counts}, mito ${x.pct_mito.toFixed(2)}%`).join('<br>')}</div></details>`;
  if (gene && c.expression) {
    const byCell = Object.fromEntries(c.quality.map(x => [x.cell, x]));
    const cells = c.expression.map(x => x.cell);
    Plotly.react('cellPlot', [
      {x:cells, y:c.expression.map(x=>x.value), text:cells, name:`${gene} expression`, type:'bar', xaxis:'x', yaxis:'y', hovertemplate:'Cell %{text}<br>Expression: %{y}<extra></extra>'},
      {x:cells, y:cells.map(cell => byCell[cell].n_genes), text:cells, name:'Genes detected', type:'scatter', mode:'markers', marker:{size:8}, xaxis:'x2', yaxis:'y2', hovertemplate:'Cell %{text}<br>Genes: %{y}<extra></extra>'},
      {x:cells, y:cells.map(cell => byCell[cell].total_counts), text:cells, name:'Total counts', type:'scatter', mode:'markers', marker:{size:8}, xaxis:'x3', yaxis:'y3', hovertemplate:'Cell %{text}<br>Counts: %{y}<extra></extra>'},
      {x:cells, y:cells.map(cell => byCell[cell].pct_mito), text:cells, name:'Mitochondrial %', type:'scatter', mode:'markers', marker:{size:8}, xaxis:'x4', yaxis:'y4', hovertemplate:'Cell %{text}<br>Mito: %{y:.2f}%<extra></extra>'}
    ], {title:`${gene} and QC — cluster ${cluster}`, margin:{t:55,l:70,r:25,b:35}, height:650, grid:{rows:4, columns:1, pattern:'independent'}, xaxis:{showticklabels:false}, xaxis2:{showticklabels:false}, xaxis3:{showticklabels:false}, xaxis4:{tickmode:'array', tickvals:cells, ticktext:cells.map((_,i)=>`Cell ${i+1}`), tickangle:0}, yaxis:{title:'Expression'}, yaxis2:{title:'Genes'}, yaxis3:{title:'Counts'}, yaxis4:{title:'Mito %'}, showlegend:true, legend:{orientation:'h', y:1.04, x:0}} , {responsive:true, displayModeBar:false});
  }
  else Plotly.purge('cellPlot');
  if (document.querySelector('#plot').data) Plotly.Plots.resize('plot');
}
window.addEventListener('resize', () => Plotly.Plots.resize('plot'));
colourMode.addEventListener('change', () => { document.querySelector('#geneControl').classList.toggle('hidden', colourMode.value !== 'gene'); draw().catch(e => document.querySelector('#summary').textContent = e.message); });
function showError(message) {
  let text = message.replace(/^Unable to load gene or cluster:\s*/i, '').replace(/^\{"detail":"?/, '').replace(/["}]$/g, '').replace(/\s+/g, ' ').trim();
  if (!text.endsWith('.')) text += '.';
  document.querySelector('#summary').innerHTML = `<p class="rounded border border-red-200 bg-red-50 p-2 text-red-700">${text}</p>`;
}
async function refresh() {
  const button = document.querySelector('#refresh');
  button.disabled = true;
  button.textContent = 'Loading…';
  document.querySelector('#summary').innerHTML = '<p class="text-slate-500">Loading data…</p>';
  try { await draw(); } catch (e) { showError(`Unable to load gene or cluster: ${e.message}`); }
  finally { button.disabled = false; button.textContent = 'Show cluster cells'; }
}
document.querySelector('#refresh').addEventListener('click', refresh); clusterEl.addEventListener('change', refresh); loadMeta().catch(e => showError(e.message));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PBMC cluster explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-7xl p-4 sm:p-6">
    <header class="mb-5"><h1 class="text-2xl font-bold">PBMC cluster explorer</h1><p class="text-sm text-slate-600">Explore the existing UMAP and individual cells.</p></header>
    <section class="grid gap-4 lg:grid-cols-[20rem_1fr]">
      <aside class="rounded-xl bg-white p-4 shadow-sm">
        <div class="grid gap-3">
          <label class="text-sm font-medium">Cluster
            <select id="cluster" class="mt-1 w-full rounded border p-2"></select>
          </label>
          <label class="text-sm font-medium">Colour map
            <select id="colourMode" class="mt-1 w-full rounded border p-2">
              <option value="cluster">Cluster</option>
              <option value="n_genes">Genes detected</option>
              <option value="total_counts">Total counts</option>
              <option value="pct_mito">Mitochondrial %</option>
              <option value="gene">Gene expression</option>
            </select>
          </label>
          <label id="geneControl" class="hidden text-sm font-medium">Gene
            <input id="gene" list="genes" value="CD3D" placeholder="e.g. CD3D" class="mt-1 w-full rounded border p-2">
            <datalist id="genes"></datalist>
          </label>
          <button id="refresh" class="rounded bg-blue-600 px-3 py-2 font-medium text-white">Show cluster cells</button>
        </div>
        <div id="summary" class="mt-4 text-sm"></div>
        <div id="cells" class="mt-3 max-h-72 overflow-auto text-xs"></div>
      </aside>
      <section class="min-w-0 rounded-xl bg-white p-2 shadow-sm sm:p-4">
        <div id="legend" class="mb-2 text-sm text-slate-600"></div>
        <div id="plot" class="h-[70vh] min-h-[20rem] w-full"></div>
        <div id="cellPlot" class="mt-4 h-72"></div>
      </section>
    </section>
  </main>
<script>
const clusterEl = document.querySelector('#cluster'), geneEl = document.querySelector('#gene'), colourMode = document.querySelector('#colourMode');
let selected = null;
async function get(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function loadMeta() {
  const m = await get('/api/meta');
  m.clusters.forEach(c => clusterEl.add(new Option(c, c)));
  m.genes.forEach(g => document.querySelector('#genes').append(new Option(g)));
  await draw();
}
async function draw() {
  const cluster = clusterEl.value, gene = geneEl.value.trim();
  const colour = colourMode.value === 'gene' ? gene : colourMode.value;
  if (colourMode.value === 'gene' && !gene) throw new Error('Choose a gene to colour the map.');
  const [u, c] = await Promise.all([get(`/api/umap?color=${encodeURIComponent(colour)}`), get(`/api/cluster/${cluster}${gene ? `?gene=${encodeURIComponent(gene)}` : ''}`)]);
  const points = u.points;
  const numeric = u.numeric;
  const selectedPoints = points.map(p => p.cluster === cluster);
  document.querySelector('#legend').innerHTML = numeric ? `<span class="font-medium">Legend:</span> colour scale shows ${colour}; selected cluster ${cluster} is outlined` : `<span class="font-medium">Legend:</span> selected cluster ${cluster} is highlighted; other clusters are muted`;
  Plotly.react('plot', [{x: points.map(p=>p.x), y: points.map(p=>p.y), text: points.map(p=>p.cell), customdata: points.map(p=>[p.cluster, p.value]), mode:'markers', type:'scattergl', marker:{size:points.map((p,i)=>selectedPoints[i] ? 10 : 5), color:numeric ? points.map(p=>p.value) : points.map(p=>p.cluster), colorscale:'Viridis', showscale:numeric, colorbar:numeric ? {title: colour} : undefined, opacity:points.map((p,i)=>selectedPoints[i] ? 1 : 0.25), line:{color:points.map((p,i)=>selectedPoints[i] ? '#111827' : 'rgba(0,0,0,0)'), width:points.map((p,i)=>selectedPoints[i] ? 2 : 0)}}, hovertemplate:'cell %{text}<br>cluster %{customdata[0]}<br>value %{customdata[1]}<extra></extra>'}], {title:`UMAP (display only) — colour: ${colour}`, autosize:true, margin:{t:40,l:40,r:10,b:40}, xaxis:{title:'UMAP 1'}, yaxis:{title:'UMAP 2'}}, {responsive:true});
  const q = c.quality;
  document.querySelector('#summary').innerHTML = `<b>Cluster ${cluster}</b><br>${q.length} cells<br><span class="font-medium">Top markers</span><div class="mt-1 overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr><th>Gene</th><th>Score</th><th>logFC</th><th>Detected</th><th>Median</th></tr></thead><tbody>${c.top_markers.map(m => `<tr><td class="pr-2 font-medium">${m.gene}</td><td>${m.score == null ? '—' : m.score.toFixed(2)}</td><td>${m.logfoldchange == null ? '—' : m.logfoldchange.toFixed(2)}</td><td>${m.cluster_detection_pct.toFixed(0)}% / ${m.rest_detection_pct.toFixed(0)}%</td><td>${m.cluster_median.toFixed(2)} / ${m.rest_median.toFixed(2)}</td></tr>`).join('')}</tbody></table><p class="mt-1 text-slate-500">Detected and median values are cluster / rest.</p></div>`;
  document.querySelector('#cells').innerHTML = '<b>Individual cells</b><br>' + q.map((x,i)=>`${i+1}. ${x.cell}: genes ${x.n_genes}, counts ${x.total_counts}, mito ${x.pct_mito.toFixed(2)}%`).join('<br>');
  if (gene && c.expression) Plotly.newPlot('cellPlot', [{x:c.expression.map(x=>x.cell), y:c.expression.map(x=>x.value), type:'bar'}], {title:`${gene} expression in cluster ${cluster}`, margin:{t:40,l:45,r:10,b:100}, xaxis:{tickangle:-60}});
  else Plotly.purge('cellPlot');
  if (document.querySelector('#plot').data) Plotly.Plots.resize('plot');
}
window.addEventListener('resize', () => Plotly.Plots.resize('plot'));
colourMode.addEventListener('change', () => { document.querySelector('#geneControl').classList.toggle('hidden', colourMode.value !== 'gene'); draw().catch(e => document.querySelector('#summary').textContent = e.message); });
function showError(message) {
  document.querySelector('#summary').innerHTML = `<p class="rounded border border-red-200 bg-red-50 p-2 text-red-700">${message}</p>`;
}
async function refresh() {
  const button = document.querySelector('#refresh');
  button.disabled = true;
  button.textContent = 'Loading…';
  document.querySelector('#summary').innerHTML = '<p class="text-slate-500">Loading data…</p>';
  try { await draw(); } catch (e) { showError(`Unable to load gene or cluster: ${e.message}`); }
  finally { button.disabled = false; button.textContent = 'Show cluster cells'; }
}
document.querySelector('#refresh').addEventListener('click', refresh); clusterEl.addEventListener('change', refresh); loadMeta().catch(e => showError(e.message));
</script>
</body>
</html>

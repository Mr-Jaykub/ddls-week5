<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PBMC cluster explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-7xl p-4 sm:p-6">
    <header class="mb-5"><h1 class="text-2xl font-bold">PBMC cluster explorer</h1><p class="text-sm text-slate-600">Explore the existing UMAP and individual cells.</p></header>
    <section class="grid gap-4 lg:grid-cols-[20rem_1fr]">
      <aside class="rounded-xl bg-white p-4 shadow-sm">
        <div class="grid gap-3">
          <label class="text-sm font-medium">Cluster
            <select id="cluster" class="mt-1 w-full rounded border p-2"></select>
          </label>
          <label class="text-sm font-medium">Gene
            <input id="gene" list="genes" placeholder="e.g. CD3D" class="mt-1 w-full rounded border p-2 uppercase">
            <datalist id="genes"></datalist>
          </label>
          <button id="refresh" class="rounded bg-blue-600 px-3 py-2 font-medium text-white">Show cluster cells</button>
        </div>
        <div id="summary" class="mt-4 text-sm"></div>
        <div id="cells" class="mt-3 max-h-72 overflow-auto text-xs"></div>
      </aside>
      <section class="min-w-0 rounded-xl bg-white p-2 shadow-sm sm:p-4">
        <div id="plot" class="h-[60vh] min-h-[ twentyrem ]"></div>
        <div id="cellPlot" class="mt-4 h-72"></div>
      </section>
    </section>
  </main>
<script>
const clusterEl = document.querySelector('#cluster'), geneEl = document.querySelector('#gene');
let selected = null;
async function get(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function loadMeta() {
  const m = await get('/api/meta');
  m.clusters.forEach(c => clusterEl.add(new Option(c, c)));
  m.genes.forEach(g => document.querySelector('#genes').append(new Option(g)));
  await draw();
}
async function draw() {
  const cluster = clusterEl.value, gene = geneEl.value.trim().toUpperCase();
  const [u, c] = await Promise.all([get('/api/umap'), get(`/api/cluster/${cluster}${gene ? `?gene=${encodeURIComponent(gene)}` : ''}`)]);
  const points = u.points;
  Plotly.newPlot('plot', [{x: points.map(p=>p.x), y: points.map(p=>p.y), text: points.map(p=>p.cell), customdata: points.map(p=>p.cluster), mode:'markers', type:'scattergl', marker:{size:6, color:points.map(p=>p.cluster), colorscale:'Viridis'}, hovertemplate:'cell %{text}<br>cluster %{customdata}<extra></extra>'}], {title:'UMAP (display only)', margin:{t:40,l:40,r:10,b:40}, xaxis:{title:'UMAP 1'}, yaxis:{title:'UMAP 2'}});
  const q = c.quality;
  document.querySelector('#summary').innerHTML = `<b>Cluster ${cluster}</b><br>${q.length} cells<br>Top markers: ${c.top_markers.join(', ')}`;
  document.querySelector('#cells').innerHTML = '<b>Individual cells</b><br>' + q.map((x,i)=>`${i+1}. ${x.cell}: genes ${x.n_genes}, counts ${x.total_counts}, mito ${x.pct_mito.toFixed(2)}%`).join('<br>');
  if (gene && c.expression) Plotly.newPlot('cellPlot', [{x:c.expression.map(x=>x.cell), y:c.expression.map(x=>x.value), type:'bar'}], {title:`${gene} expression in cluster ${cluster}`, margin:{t:40,l:45,r:10,b:100}, xaxis:{tickangle:-60}});
  else Plotly.purge('cellPlot');
}
document.querySelector('#refresh').addEventListener('click', draw); clusterEl.addEventListener('change', draw); loadMeta().catch(e => document.querySelector('#summary').textContent = e.message);
</script>
</body>
</html>
